<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" />
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" />
  </g>

  <!-- Top Brand Header -->
  <g transform="translate(100, 90)">
    <rect width="64" height="64" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2" />
    <path d="M20 23C20 19.5 22.5 17.5 26.5 17.5H40C44 17.5 46.5 20 46.5 23.5C46.5 27 44 29.5 40 29.5H26.5C22.5 29.5 20 32 20 35.5C20 39 22.5 41.5 26.5 41.5H43" 
          stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="20" cy="23" r="3" fill="#06b6d4" />
    <circle cx="43" cy="41.5" r="3.5" fill="#38bdf8" />
    
    <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      Flow<tspan fill="#06b6d4">Form</tspan>
    </text>
    
    <!-- Open Source Pill -->
    <rect x="270" y="20" width="130" height="30" rx="8" fill="#131b2e" stroke="#06b6d4" stroke-width="1.5" />
    <text x="282" y="40" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">AGPLv3 &middot; OSS</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.035em">
    The Open-Source
  </text>
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="54" font-weight="800" fill="url(#brandGrad)" letter-spacing="-0.035em">
    Forms Platform
  </text>

  <!-- Subtitle -->
  <text x="100" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Mode 1: Headless Form Endpoints (Web3Forms/Formspree alternative)
  </text>
  <text x="100" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Mode 2: Dynamic Multi-Step Wizards with Branching Logic (Typeform alternative)
  </text>

  <!-- Footer Pills -->
  <g transform="translate(100, 520)">
    <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#38bdf8">&dollar;0 Platform Fees</text>

    <rect x="230" width="220" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="250" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#38bdf8">100% Data Sovereignty</text>

    <rect x="470" width="230" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="490" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#38bdf8">React &middot; Vue &middot; Livewire</text>

    <rect x="720" width="200" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="740" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#38bdf8">Model Context Protocol</text>
  </g>
</svg>
