<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="ffGradDark" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon (40x40 on dark background) -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <path d="M15 16C15 14 16.5 12.5 19 12.5H27C29.5 12.5 31 14 31 16.2C31 18.5 29.5 20 27 20H19C16.5 20 15 21.5 15 23.8C15 26 16.5 27.5 19 27.5H29" 
        stroke="url(#ffGradDark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="15" cy="16" r="1.8" fill="#06b6d4" />
  <circle cx="29" cy="27.5" r="2.4" fill="#38bdf8" filter="url(#glowDark)" />
  <circle cx="29" cy="27.5" r="1" fill="#ffffff" />

  <!-- Wordmark for Dark Theme -->
  <text x="56" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.035em">
    Flow<tspan fill="#06b6d4">Form</tspan>
  </text>

  <!-- Tagline / Version Badge -->
  <rect x="166" y="15" width="46" height="18" rx="5" fill="#131b2e" stroke="#1e293b" stroke-width="1" />
  <text x="173" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">v0.1.0</text>
</svg>
